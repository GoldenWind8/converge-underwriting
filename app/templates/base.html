<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Aegis Underwriting Intelligence{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23126e82'/%3E%3Cpath d='M16 6 25 10v6c0 5.5-3.8 9.1-9 11-5.2-1.9-9-5.5-9-11v-6l9-4Z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-950:#071421; --navy-900:#0b1d2d; --navy-800:#123047;
      --ink:#14283a; --muted:#607386; --muted-2:#8b9aaa;
      --line:#dce4ea; --line-soft:#eaf0f4; --surface:#ffffff; --canvas:#f3f6f8;
      --brand:#126e82; --brand-dark:#0b5364; --brand-soft:#e8f5f7;
      --gold:#b98a35; --gold-soft:#fbf5e8;
      --low:#208567; --moderate:#b47913; --elevated:#c65b21; --high:#b83c3c;
      --shadow-sm:0 1px 2px rgba(7,20,33,.05),0 4px 14px rgba(7,20,33,.04);
      --shadow-lg:0 18px 50px rgba(7,20,33,.11);
      --radius:14px;
    }
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--canvas); font:14px/1.55 'DM Sans',sans-serif; }
    a { color:var(--brand-dark); }
    .topbar { position:sticky; top:0; z-index:50; background:rgba(7,20,33,.97); color:#fff;
              border-bottom:1px solid rgba(255,255,255,.08); backdrop-filter:blur(18px); }
    .topbar-inner { max-width:1440px; height:68px; margin:auto; padding:0 28px; display:flex;
                    align-items:center; justify-content:space-between; gap:24px; }
    .brand { display:flex; align-items:center; gap:11px; color:#fff; text-decoration:none; }
    .brand-mark { width:32px; height:32px; display:grid; place-items:center; border-radius:9px;
                  background:linear-gradient(145deg,#18a0ab,#0b667c); box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); }
    .brand-mark svg { width:18px; }
    .brand-name { font-weight:700; letter-spacing:-.02em; font-size:15px; }
    .brand-sub { display:block; color:#91a7b8; font-size:10px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; }
    .nav-links { display:flex; align-items:center; gap:5px; }
    .nav-links a { color:#aab9c5; text-decoration:none; font-size:13px; font-weight:500; padding:9px 13px; border-radius:8px; }
    .nav-links a:hover { color:#fff; background:rgba(255,255,255,.07); }
    .env-badge { color:#b9e7e8; border:1px solid rgba(71,190,193,.35); background:rgba(21,126,137,.17);
                 border-radius:999px; font-size:10px; letter-spacing:.08em; padding:5px 9px; text-transform:uppercase; }
    .wrap { max-width:1240px; margin:auto; padding:38px 28px 64px; }
    .wrap.wide { max-width:1440px; }
    .wrap.narrow { max-width:940px; }
    h1,h2,h3,p { margin-top:0; }
    h1 { margin-bottom:8px; color:var(--navy-950); font-size:30px; line-height:1.18; letter-spacing:-.035em; }
    h2 { color:var(--navy-900); font-size:17px; letter-spacing:-.015em; }
    h3 { color:var(--navy-900); font-size:14px; }
    .eyebrow { color:var(--brand); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; margin-bottom:9px; }
    .sub { max-width:720px; color:var(--muted); font-size:15px; margin-bottom:24px; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
            box-shadow:var(--shadow-sm); }
    .card-pad { padding:26px; }
    .panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
                  padding:19px 22px; border-bottom:1px solid var(--line-soft); }
    .panel-head h2,.panel-head h3 { margin:0; }
    .panel-body { padding:22px; }
    .muted { color:var(--muted); }
    .hint { color:var(--muted); font-size:12px; }
    .mono,.code { font-family:'IBM Plex Mono',monospace; font-size:12px; }
    .pill,.audit-chip { display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border:1px solid var(--line);
                        border-radius:999px; background:#f7f9fa; color:var(--muted); font-size:11px; font-weight:600; text-decoration:none; }
    .audit-chip:hover { color:var(--brand-dark); border-color:#9ecbd2; background:var(--brand-soft); }
    .status-dot { width:7px; height:7px; border-radius:50%; background:var(--low); box-shadow:0 0 0 3px rgba(32,133,103,.12); }
    .band { display:inline-flex; align-items:center; border-radius:999px; padding:5px 10px; color:#fff; font-size:11px; font-weight:700; }
    .band.Low { background:var(--low); } .band.Moderate { background:var(--moderate); }
    .band.Elevated { background:var(--elevated); } .band.High { background:var(--high); }
    .severity { font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
    .severity.high { color:var(--high); } .severity.medium { color:var(--elevated); }
    .severity.low { color:var(--moderate); } .severity.info { color:var(--muted); }
    label { display:block; margin-bottom:7px; color:var(--navy-900); font-size:12px; font-weight:700; }
    textarea,select,input[type=text],input[type=number],input[type=search] {
      width:100%; border:1px solid #ccd7df; border-radius:9px; padding:10px 11px; color:var(--ink);
      background:#fff; font:13px 'DM Sans',sans-serif; transition:border .15s,box-shadow .15s; }
    textarea:focus,select:focus,input:focus { outline:none; border-color:#4d9caa; box-shadow:0 0 0 3px rgba(18,110,130,.12); }
    input[type=file] { font:12px 'DM Sans',sans-serif; color:var(--muted); }
    button,.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:9px;
                  padding:10px 16px; color:#fff; background:var(--brand); font:600 13px 'DM Sans',sans-serif;
                  cursor:pointer; text-decoration:none; box-shadow:0 2px 5px rgba(18,110,130,.18); transition:.16s ease; }
    button:hover,.btn:hover { background:var(--brand-dark); transform:translateY(-1px); box-shadow:0 5px 13px rgba(18,110,130,.22); }
    button.secondary,.btn.secondary { color:var(--navy-800); background:#fff; border:1px solid #c9d5dd; box-shadow:none; }
    button.secondary:hover,.btn.secondary:hover { background:#f7f9fa; border-color:#a8bac6; }
    button.danger { color:var(--high); background:#fff; border:1px solid #e6baba; box-shadow:none; }
    button:disabled { opacity:.55; cursor:not-allowed; transform:none; }
    table { width:100%; border-collapse:collapse; }
    th { padding:11px 14px; color:var(--muted); background:#f8fafb; border-bottom:1px solid var(--line);
         font-size:10px; text-align:left; text-transform:uppercase; letter-spacing:.08em; }
    td { padding:14px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
    tr:last-child td { border-bottom:0; }
    .empty { padding:44px 24px; color:var(--muted); text-align:center; }
    .notice { padding:13px 15px; border:1px solid #b7d8dd; border-radius:10px; background:var(--brand-soft); color:#174d58; font-size:13px; }
    .notice.warning { background:var(--gold-soft); border-color:#ead9ad; color:#765819; }
    .page-actions { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    footer { padding:0 28px 30px; color:#8292a0; font-size:11px; text-align:center; }
    .loading-overlay { position:fixed; inset:0; z-index:100; display:none; place-items:center; background:rgba(7,20,33,.72); backdrop-filter:blur(8px); }
    .loading-overlay.active { display:grid; }
    .loading-card { width:min(420px,calc(100% - 36px)); padding:30px; border:1px solid rgba(255,255,255,.12); border-radius:16px;
                    color:#fff; background:var(--navy-900); box-shadow:var(--shadow-lg); }
    .loading-line { height:3px; margin:20px 0; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.12); }
    .loading-line::after { content:""; display:block; width:40%; height:100%; background:#43b4bd; animation:scan 1.3s ease-in-out infinite; }
    @keyframes scan { from{transform:translateX(-110%)} to{transform:translateX(360%)} }
    @media(max-width:760px) {
      .topbar-inner{padding:0 16px}.env-badge{display:none}.nav-links a{padding:8px;font-size:12px}
      .brand-name{display:none}.wrap{padding:26px 16px 48px}h1{font-size:25px}.card-pad{padding:20px}
    }
    @media print { .topbar,footer,.noprint{display:none!important}.wrap{max-width:none;padding:0}.card{border:0;box-shadow:none}body{background:#fff} }
  </style>
  {% block css %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M12 2.5 20 6v5.2c0 5.1-3.4 8.7-8 10.3-4.6-1.6-8-5.2-8-10.3V6l8-3.5Z"/><path d="m8.5 12 2.1 2.1 4.9-5"/></svg></span>
        <span><span class="brand-name">Aegis Underwriting</span><span class="brand-sub">Decision Intelligence</span></span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="/">Assess</a><a href="/cases">Case memory</a><a href="/playbook">Playbook</a>
      </nav>
      <span class="env-badge">Controlled POC</span>
    </div>
  </header>
  <main class="wrap {% block wrap_class %}{% endblock %}">{% block content %}{% endblock %}</main>
  <footer>Human-controlled AI · Deterministic scoring · Evidence-linked decisions</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
